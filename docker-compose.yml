# PostgreSQL local con volumen persistente: los datos sobreviven a reinicios (docker compose down NO los borra;
# `docker compose down -v` sí). Uso: pnpm db:up
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: enscafe
      POSTGRES_PASSWORD: enscafe
      POSTGRES_DB: enscafe
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde tu computadora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enscafe -d enscafe"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
